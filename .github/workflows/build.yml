name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          # ONNX Runtime stopped shipping x86_64 macOS binaries after 1.23, and
          # `ort` pins a newer release, so there is no Intel macOS build.
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: msi,nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Build and package
        run: >
          pnpm --filter @deckpress/desktop exec tauri build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: deckpress-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
